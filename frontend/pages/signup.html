<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create your ElevateCV AI account — Start building professional, ATS-optimized resumes with AI.">
    <meta name="author" content="ElevateCV AI">
    <meta name="theme-color" content="#6C3CE1">

    <title>Sign Up — ElevateCV AI</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/reset.css">
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/animations.css">
    <link rel="stylesheet" href="../assets/css/auth.css">
</head>
<body>

    <section class="auth" id="auth-signup">
        <div class="auth__bg">
            <div class="auth__orb auth__orb--1"></div>
            <div class="auth__orb auth__orb--2"></div>
        </div>

        <div class="auth__card">
            <div class="auth__header">
                <a href="../index.html" class="auth__logo" id="auth-logo">
                    <span class="auth__logo-icon">⚡</span>
                    <span class="auth__logo-text">ElevateCV<span class="auth__logo-accent">AI</span></span>
                </a>
                <h1 class="auth__title">Create Account</h1>
                <p class="auth__subtitle">Start your career journey with ElevateCV AI</p>
            </div>

            <!-- Alert Messages -->
            <div class="auth__alert auth__alert--error" id="signup-alert-error">
                <span class="auth__alert-icon">⚠️</span>
                <span id="signup-error-text"></span>
            </div>
            <div class="auth__alert auth__alert--success" id="signup-alert-success">
                <span class="auth__alert-icon">✅</span>
                <span id="signup-success-text"></span>
            </div>

            <form class="auth__form" id="signup-form" novalidate>
                <div class="form-group">
                    <label class="form-group__label" for="signup-name">Full Name</label>
                    <div class="form-group__input-wrapper">
                        <span class="form-group__icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                                <circle cx="12" cy="7" r="4"/>
                            </svg>
                        </span>
                        <input
                            type="text"
                            id="signup-name"
                            class="form-group__input"
                            placeholder="John Doe"
                            autocomplete="name"
                            required
                        >
                    </div>
                    <span class="form-group__error" id="signup-name-error"></span>
                </div>

                <div class="form-group">
                    <label class="form-group__label" for="signup-email">Email Address</label>
                    <div class="form-group__input-wrapper">
                        <span class="form-group__icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="2" y="4" width="20" height="16" rx="2"/>
                                <path d="M22 7l-10 6L2 7"/>
                            </svg>
                        </span>
                        <input
                            type="email"
                            id="signup-email"
                            class="form-group__input"
                            placeholder="you@example.com"
                            autocomplete="email"
                            required
                        >
                    </div>
                    <span class="form-group__error" id="signup-email-error"></span>
                </div>

                <div class="form-group">
                    <label class="form-group__label" for="signup-password">Password</label>
                    <div class="form-group__input-wrapper">
                        <span class="form-group__icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                <path d="M7 11V7a5 5 0 0110 0v4"/>
                            </svg>
                        </span>
                        <input
                            type="password"
                            id="signup-password"
                            class="form-group__input"
                            placeholder="Minimum 6 characters"
                            autocomplete="new-password"
                            required
                        >
                        <button type="button" class="form-group__toggle" id="signup-toggle-password" aria-label="Toggle password visibility">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                    <span class="form-group__error" id="signup-password-error"></span>
                </div>

                <div class="form-group">
                    <label class="form-group__label" for="signup-confirm-password">Confirm Password</label>
                    <div class="form-group__input-wrapper">
                        <span class="form-group__icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                            </svg>
                        </span>
                        <input
                            type="password"
                            id="signup-confirm-password"
                            class="form-group__input"
                            placeholder="Re-enter your password"
                            autocomplete="new-password"
                            required
                        >
                    </div>
                    <span class="form-group__error" id="signup-confirm-password-error"></span>
                </div>

                <button type="submit" class="auth__submit" id="signup-submit">
                    <span class="auth__submit-text">Create Account</span>
                    <span class="auth__spinner"></span>
                </button>
            </form>

            <div class="auth__footer">
                <span>Already have an account? </span>
                <a href="login.html" class="auth__footer-link" id="link-to-login">Log In</a>
            </div>
        </div>
    </section>

    <!-- Scripts -->
    <script src="../js/utils/helpers.js"></script>
    <script src="../js/pages/signup.js"></script>
</body>
</html>
