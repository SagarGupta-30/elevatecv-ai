<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ElevateCV AI — Build and manage your professional resume with our step-by-step wizard.">
    <title>Resume Builder — ElevateCV AI</title>

    <!-- Google Fonts: Plus Jakarta Sans (matches design system) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Design System -->
    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/reset.css">
    <link rel="stylesheet" href="../assets/css/global.css">

    <!-- Dashboard layout (sidebar, topbar, profile dropdown) — Sprint 1, untouched -->
    <link rel="stylesheet" href="../assets/css/dashboard.css">

    <!-- Builder wizard styles — Sprint 2 -->
    <link rel="stylesheet" href="../assets/css/builder.css">

    <!-- Resume paper styles — Sprint 2 Live Preview -->
    <link rel="stylesheet" href="../assets/css/resume.css">
</head>
<body>
    <div class="dashboard-layout">

        <!-- ── Sidebar (Sprint 1 — unchanged) ───────────────────────── -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar__header">
                <a href="dashboard.html" class="sidebar__logo">
                    <span class="sidebar__logo-icon">⚡</span>
                    <span class="sidebar__logo-text">ElevateCV<span class="sidebar__logo-accent">AI</span></span>
                </a>
                <button class="sidebar__close" id="sidebar-close" aria-label="Close sidebar">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 6L6 18M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <nav class="sidebar__nav">
                <ul class="sidebar__menu">
                    <li class="sidebar__item">
                        <a href="dashboard.html" class="sidebar__link">
                            <span class="sidebar__icon">📊</span>
                            Dashboard
                        </a>
                    </li>
                    <li class="sidebar__item">
                        <a href="#" class="sidebar__link">
                            <span class="sidebar__icon">📄</span>
                            My Resumes
                        </a>
                    </li>
                    <li class="sidebar__item">
                        <a href="builder.html" class="sidebar__link sidebar__link--active">
                            <span class="sidebar__icon">✍️</span>
                            Resume Builder
                        </a>
                    </li>
                    <li class="sidebar__item">
                        <a href="preview.html" class="sidebar__link">
                            <span class="sidebar__icon">👁️</span>
                            Preview Resume
                        </a>
                    </li>
                    <li class="sidebar__item">
                        <a href="#" class="sidebar__link">
                            <span class="sidebar__icon">🎯</span>
                            ATS Analysis
                        </a>
                    </li>
                    <li class="sidebar__item">
                        <a href="#" class="sidebar__link">
                            <span class="sidebar__icon">🤝</span>
                            Job Match
                        </a>
                    </li>
                </ul>

                <div class="sidebar__divider"></div>

                <ul class="sidebar__menu">
                    <li class="sidebar__item">
                        <a href="#" class="sidebar__link">
                            <span class="sidebar__icon">👤</span>
                            Profile
                        </a>
                    </li>
                    <li class="sidebar__item">
                        <a href="#" class="sidebar__link">
                            <span class="sidebar__icon">⚙️</span>
                            Settings
                        </a>
                    </li>
                </ul>
            </nav>
        </aside>

        <!-- ── Main Wrapper ──────────────────────────────────────────── -->
        <div class="main-wrapper">

            <!-- ── Topbar (Sprint 1 — unchanged) ─────────────────────── -->
            <header class="topbar">
                <div class="topbar__left">
                    <button class="topbar__toggle" id="sidebar-toggle" aria-label="Toggle sidebar">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 6h16M4 12h16M4 18h16"/>
                        </svg>
                    </button>
                    <h1 class="topbar__title">Resume Builder</h1>
                </div>

                <div class="topbar__right">
                    <div class="topbar__profile" id="profile-dropdown-toggle">
                        <div class="topbar__avatar" id="user-avatar">U</div>
                        <span class="topbar__username" id="user-name-display">User</span>
                        <svg class="topbar__dropdown-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M6 9l6 6 6-6"/>
                        </svg>

                        <!-- Profile Dropdown -->
                        <div class="profile-dropdown" id="profile-dropdown">
                            <div class="profile-dropdown__header">
                                <span class="profile-dropdown__name"  id="dropdown-user-name">User</span>
                                <span class="profile-dropdown__email" id="dropdown-user-email">user@example.com</span>
                            </div>
                            <div class="profile-dropdown__divider"></div>
                            <ul class="profile-dropdown__list">
                                <li><a href="#" class="profile-dropdown__item">Profile</a></li>
                                <li><a href="#" class="profile-dropdown__item">Settings</a></li>
                                <div class="profile-dropdown__divider"></div>
                                <li><button class="profile-dropdown__item profile-dropdown__item--danger" id="btn-logout">Logout</button></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </header>

            <!-- ── Builder Content ───────────────────────────────────── -->
            <main class="dashboard-content builder-content" id="builder-main">
                <div class="builder-split">

                    <!-- LEFT: Wizard form (existing, untouched) -->
                    <div class="builder-split__form">
                        <!--
                            The wizard shell is built dynamically by ResumeBuilderV2.init()
                            in js/pages/builder.js. This keeps the HTML clean and modular.
                            builder-container is the mount point.
                        -->
                        <div class="builder-container" id="builder-root"></div>
                    </div>

                    <!-- RIGHT: Live Preview Panel (desktop only, sticky) -->
                    <div class="builder-split__preview" id="live-preview-panel" aria-label="Live resume preview" role="complementary">
                        <div class="live-preview-panel">
                            <div class="live-preview-panel__topbar">
                                <span class="live-preview-panel__label">Live Preview</span>
                                <span class="live-preview-panel__badge">
                                    <span class="live-preview-panel__badge-dot" aria-hidden="true"></span>
                                    Auto-updating
                                </span>
                            </div>
                            <div class="live-preview-panel__canvas" id="live-preview-canvas">
                                <!-- PreviewRenderer injects resume HTML here -->
                            </div>
                        </div>
                    </div>

                </div>
            </main>

        </div><!-- /.main-wrapper -->
    </div><!-- /.dashboard-layout -->

    <!-- ── Scripts ───────────────────────────────────────────────────────
         Load order matters:
         1. Utils (config, helpers) — no dependencies
         2. State manager — depends on nothing
         3. Steps config — depends on nothing
         4. Reusable components — depend on state
         5. Step panel renderers — depend on components
         6. Orchestrators — depend on everything above
         7. Sprint 1 dashboard — initialises auth + sidebar
    ──────────────────────────────────────────────────────────────────── -->

    <!-- Utils (Sprint 1 — unchanged) -->
    <script src="../js/utils/config.js"></script>
    <script src="../js/utils/helpers.js"></script>
    <script src="../js/utils/toast.js"></script>
    <script src="../js/utils/resumeService.js"></script>

    <!-- State & config -->
    <script src="../js/components/builderState.js"></script>
    <script src="../js/components/wizardSteps.js"></script>

    <!-- Reusable UI components -->
    <script src="../js/components/tagInput.js"></script>
    <script src="../js/components/bulletEditor.js"></script>
    <script src="../js/components/progressBar.js"></script>
    <script src="../js/components/wizardNav.js"></script>

    <!-- Step panel renderers -->
    <script src="../js/components/stepPanels.js"></script>

    <!-- Sprint 2: Live Preview Renderer -->
    <script src="../js/components/previewRenderer.js"></script>

    <!-- Sprint 1: Dashboard (auth, sidebar, profile dropdown) — untouched -->
    <script src="../js/pages/dashboard.js"></script>

    <!-- Sprint 2: Builder wizard orchestrator -->
    <script src="../js/pages/builder.js"></script>
</body>
</html>
