<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Log in to ElevateCV AI — Access your AI-powered resume builder and career tools.">
    <meta name="author" content="ElevateCV AI">
    <meta name="theme-color" content="#080A14">

    <!-- Canonical URL -->
    <link rel="canonical" href="https://elevatecv-ai.netlify.app/pages/login.html">

    <!-- Open Graph Metadata -->
    <meta property="og:title" content="Log In — ElevateCV AI">
    <meta property="og:description" content="Log in to your ElevateCV AI account to manage your professional resumes.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://elevatecv-ai.netlify.app/pages/login.html">

    <title>Log In — ElevateCV AI</title>

    <!-- Google Fonts: Plus Jakarta Sans & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/reset.css">
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/animations.css">
    <link rel="stylesheet" href="../assets/css/auth.css">
</head>
<body>

    <section class="auth" id="auth-login">
        <div class="auth__bg">
            <div class="auth__orb auth__orb--1"></div>
            <div class="auth__orb auth__orb--2"></div>
        </div>

        <div class="auth__card">
            <div class="auth__header">
                <a href="../index.html" class="auth__logo" id="auth-logo">
                    <span class="auth__logo-text">ElevateCV<span class="auth__logo-accent">AI</span></span>
                </a>
                <h1 class="auth__title">Welcome Back</h1>
                <p class="auth__subtitle">Log in to your account to continue</p>
            </div>

            <!-- Alert Messages -->
            <div class="auth__alert auth__alert--error" id="login-alert-error">
                <span class="auth__alert-icon">⚠️</span>
                <span id="login-error-text"></span>
            </div>
            <div class="auth__alert auth__alert--success" id="login-alert-success">
                <span class="auth__alert-icon">✅</span>
                <span id="login-success-text"></span>
            </div>

            <form class="auth__form" id="login-form" novalidate>
                <div class="form-group">
                    <label class="form-group__label" for="login-email">Email Address</label>
                    <div class="form-group__input-wrapper">
                        <span class="form-group__icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="2" y="4" width="20" height="16" rx="2"/>
                                <path d="M22 7l-10 6L2 7"/>
                            </svg>
                        </span>
                        <input
                            type="email"
                            id="login-email"
                            class="form-group__input"
                            placeholder="you@example.com"
                            autocomplete="email"
                            required
                        >
                    </div>
                    <span class="form-group__error" id="login-email-error"></span>
                </div>

                <div class="form-group">
                    <label class="form-group__label" for="login-password">Password</label>
                    <div class="form-group__input-wrapper">
                        <span class="form-group__icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                <path d="M7 11V7a5 5 0 0110 0v4"/>
                            </svg>
                        </span>
                        <input
                            type="password"
                            id="login-password"
                            class="form-group__input"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >
                        <button type="button" class="form-group__toggle" id="login-toggle-password" aria-label="Toggle password visibility">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                    <span class="form-group__error" id="login-password-error"></span>
                </div>

                <button type="submit" class="auth__submit" id="login-submit">
                    <span class="auth__submit-text">Log In</span>
                    <span class="auth__spinner"></span>
                </button>
            </form>

            <div class="auth__footer">
                <span>Don't have an account? </span>
                <a href="signup.html" class="auth__footer-link" id="link-to-signup">Sign Up</a>
            </div>
        </div>
    </section>

    <!-- Scripts -->
    <script src="../js/utils/helpers.js"></script>
    <script src="../js/utils/config.js"></script>
    <script src="../js/utils/toast.js"></script>
    <script src="../js/pages/login.js"></script>
</body>
</html>
