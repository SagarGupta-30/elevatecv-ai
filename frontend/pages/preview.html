<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ElevateCV AI — Preview and print your professional resume.">
    <meta name="author" content="ElevateCV AI">
    <meta name="theme-color" content="#080A14">

    <!-- Canonical URL -->
    <link rel="canonical" href="https://elevatecv-ai.netlify.app/pages/preview.html">

    <!-- Open Graph Metadata -->
    <meta property="og:title" content="Preview Resume — ElevateCV AI">
    <meta property="og:description" content="Preview and print your recruiter-ready resume on ElevateCV AI.">
    <meta property="og:type" content="website">

    <title>Preview Resume — ElevateCV AI</title>

    <!-- Google Fonts: Plus Jakarta Sans & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Design System -->
    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/reset.css">
    <link rel="stylesheet" href="../assets/css/global.css">

    <!-- Dashboard layout (sidebar, topbar, profile dropdown) -->
    <link rel="stylesheet" href="../assets/css/dashboard.css">

    <!-- Preview page chrome (controls, wrapper) -->
    <link rel="stylesheet" href="../assets/css/preview.css">

    <!-- Resume paper renderer styles -->
    <link rel="stylesheet" href="../assets/css/resume.css">
</head>
<body>
    <div class="dashboard-layout hide-on-print">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar__header">
                <a href="dashboard.html" class="sidebar__logo">
                    <span class="sidebar__logo-text">ElevateCV<span class="sidebar__logo-accent">AI</span></span>
                </a>
                <button class="sidebar__close" id="sidebar-close" aria-label="Close sidebar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 6L6 18M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <nav class="sidebar__nav">
                <ul class="sidebar__menu">
                    <li class="sidebar__item">
                        <a href="dashboard.html" class="sidebar__link">
                            <span class="sidebar__icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="3" width="7" height="7" rx="1"/>
                                    <rect x="14" y="3" width="7" height="7" rx="1"/>
                                    <rect x="14" y="14" width="7" height="7" rx="1"/>
                                    <rect x="3" y="14" width="7" height="7" rx="1"/>
                                </svg>
                            </span>
                            Dashboard
                        </a>
                    </li>
                    <li class="sidebar__item">
                        <a href="builder.html" class="sidebar__link">
                            <span class="sidebar__icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
                                    <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
                                </svg>
                            </span>
                            Resume Builder
                        </a>
                    </li>
                    <li class="sidebar__item">
                        <a href="preview.html" class="sidebar__link sidebar__link--active">
                            <span class="sidebar__icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </span>
                            Preview Resume
                        </a>
                    </li>
                    <li class="sidebar__item">
                        <a href="#" class="sidebar__link">
                            <span class="sidebar__icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="12" cy="12" r="10"/>
                                    <path d="M12 6v6l4 2"/>
                                </svg>
                            </span>
                            ATS Analysis
                        </a>
                    </li>
                    <li class="sidebar__item">
                        <a href="#" class="sidebar__link">
                            <span class="sidebar__icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                                    <polyline points="22 4 12 14.01 9 11.01"/>
                                </svg>
                            </span>
                            Job Match
                        </a>
                    </li>
                </ul>

                <div class="sidebar__divider"></div>

                <ul class="sidebar__menu">
                    <li class="sidebar__item">
                        <a href="#" class="sidebar__link">
                            <span class="sidebar__icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                                    <circle cx="12" cy="7" r="4"/>
                                </svg>
                            </span>
                            Profile
                        </a>
                    </li>
                    <li class="sidebar__item">
                        <a href="#" class="sidebar__link">
                            <span class="sidebar__icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="12" cy="12" r="3"/>
                                    <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68V4.5a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/>
                                </svg>
                            </span>
                            Settings
                        </a>
                    </li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content Area -->
        <div class="main-wrapper">
            <!-- Top Navigation -->
            <header class="topbar hide-on-print">
                <div class="topbar__left">
                    <button class="topbar__toggle" id="sidebar-toggle" aria-label="Toggle sidebar">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 6h16M4 12h16M4 18h16"/>
                        </svg>
                    </button>
                </div>
                <div class="topbar__right">
                    <div class="topbar__profile" id="profile-dropdown-toggle">
                        <div class="topbar__avatar" id="user-avatar">U</div>
                        <span class="topbar__username" id="user-name-display">User</span>
                        <svg class="topbar__dropdown-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M6 9l6 6 6-6"/>
                        </svg>

                        <!-- Profile Dropdown -->
                        <div class="profile-dropdown" id="profile-dropdown">
                            <div class="profile-dropdown__header">
                                <span class="profile-dropdown__name" id="dropdown-user-name">User</span>
                                <span class="profile-dropdown__email" id="dropdown-user-email">user@example.com</span>
                            </div>
                            <div class="profile-dropdown__divider"></div>
                            <ul class="profile-dropdown__list">
                                <li><a href="#" class="profile-dropdown__item">Profile</a></li>
                                <li><a href="#" class="profile-dropdown__item">Settings</a></li>
                                <div class="profile-dropdown__divider"></div>
                                <li><button class="profile-dropdown__item profile-dropdown__item--danger" id="btn-logout">Logout</button></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Preview Content -->
            <main class="dashboard-content preview-dashboard">

                <!-- Controls Bar -->
                <div class="preview-controls hide-on-print">
                    <div class="preview-controls__header">
                        <div>
                            <h1 class="section-title" style="margin-bottom: var(--space-1)">Resume Preview</h1>
                            <p class="section-subtitle">Select a saved resume to preview and print.</p>
                        </div>
                        <div class="preview-controls__actions">
                            <select id="resume-selector" class="form-input" style="width: 240px;" aria-label="Select resume">
                                <option value="">-- Load Resume --</option>
                            </select>
                            <button id="btn-print" class="btn btn--primary" aria-label="Print or save as PDF">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:6px;vertical-align:middle;">
                                    <polyline points="6 9 6 2 18 2 18 9"/>
                                    <path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/>
                                    <rect x="6" y="14" width="12" height="8"/>
                                </svg>
                                Print / Save PDF
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Resume Paper Render Target -->
                <div class="preview-paper-wrapper" id="preview-paper-wrapper">
                    <div id="preview-canvas" class="resume-paper">
                        <!-- PreviewRenderer injects resume HTML here -->
                        <p class="rv-empty">Select a resume above to preview it here.</p>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../js/utils/helpers.js"></script>
    <script src="../js/utils/config.js"></script>
    <script src="../js/utils/toast.js"></script>

    <!-- PreviewRenderer (shared component) -->
    <script src="../js/components/previewRenderer.js"></script>

    <!-- Dashboard.js handles auth guard, sidebar toggle, profile dropdown -->
    <script src="../js/pages/dashboard.js"></script>

    <!-- Preview page controller -->
    <script src="../js/pages/preview.js"></script>
</body>
</html>
